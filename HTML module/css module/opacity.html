<!DOCTYPE html>
<html>
    <head>
        <title>
            opacity
        </title>
        <style>
            div{
                background-color: red;
                padding: 10px;
            }
            div.first{
                opacity: 1;
            }
            div.second{
                opacity: 0.6;
            }
            div.third{
                opacity: 0.3;
            }
            div.fourth{
                opacity: 0;
            }

        </style>
    </head>
    <body>
        <h1>this is the opacity</h1>
        <div class="first">first opacity</div>
        <div class="second">second opacity</div>
        <div class="third">third opacity</div>
        <div class="fourth">fourth opacity</div>
    </body>
</html>

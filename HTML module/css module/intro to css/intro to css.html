<!DOCTYPE html>
<html>
 <meta charset="UTF 8">
 <meta name="viewport" content="width=device-width initial-scale =1.0">

     
    
    
    <head>
        <title>CSS STYLING EXAMPLES </title>   
<!--internal css-->
<style>
    h2{
        color: red;
    }
</style>
<!--external css-->
<link ref="stylesheet" href="style.css">

    </head>

    <body>
        <hr>
  <!--inline css-->
<h1 style="color:blue;" inline css example> </h1>
<!--internal css-->
<h2 INTERNAL CSS EXAMPLE></h1>
    <!--external css-->
    <h3 EXTERNAL CSS EXAMPLE></h1>
    
    <hr>
    <!--element selector-->
    <h4 ELEMENT selector EXAMPLE></h4>
    <h4 ELEMENT selector EXAMPLE></h4>
    
    <!--element class and id selector-->
    <h2 class="myclass"> class selector example</h2>
    <h2 id="myid"> id selector example</h2>
    <h2 class="myclass"> class selector example</h2>

    <hr>
<!--group  selector element-->
<h5> group selector example</h5>
<p> group selector example</p>
<hr>
    </body>
</html

<!DOCTYPE html>
<html>
    <head>
        <title>
            loops
        </title>
    </head>
    <body>
    <div id="number"></div>
   </head>
    <script>
        var text=""
        var i=0;
        while(i<1000){
            text+="<br> the number is" + i;
            i++;
        }
        document.getElementById("number").innerHTML=text;
       </script>
        </body>
</html>

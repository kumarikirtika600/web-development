<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" initial-scale="1">
        <title>
         carousel
        </title>
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </head>
<body>
    <div class="container">
        <h2>carousel</h2>
        <div id="myCarousel" class="carousel slide" data-ride="carousel">
            <ol class="carousel-indicator">
                <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
                <li data-target="#myCarousel" data-slide-to="1"></li>
                <li data-target="#myCarousel" data-slide-to="2"></li>
            </ol>
            <div class="Carousel-inner">
                <div class="item active">
                    <img src="pic.jpg" alt="image 1">
                    
                </div>
                <div class="item active">
                    <img src="pic.jpg" alt="image 2">

                </div>
                <div class="item active">
                    <img src="https://th.bing.com/th/id/OIP.dcOfEMdnlg8Z-Dq6WeMr_gHaEK?w=279&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" alt="image 3">
                </div>
            </div>
                <a class="left-carousel-control" href="" data-slide="prev">
<span class="glyphicon glyphicon-chevron-left"></span>
<span control="sr-only">previous</span></a>
           
            <a class="right-carousel-control" href="#mycarousel" data-slide="next">
<span class="glyphicon glyphicon-chevron-right"></span>
<span control="sr-only">next</span>
            </a>    
            
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>
            method
        </title>
    </head>
    <body>
        <div id="first"></div>
        <div id="second"></div>
        <div id="pop"></div>
        <script>
            var toys =["barbie","robot car","robot","football"]
document.getElementById("first").innerHTML=toys.join('$');
document.getElementById("second").innerHTML=toys;
toys.pop()
document.getElementById("pop").innerHTML=toys;
        </script>
        
    </body>
</html>
